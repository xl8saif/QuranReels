name: Browser QA

on:
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://xl8saif.github.io/QuranReels/
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled Quran translations
        run: node scripts/verify-translations.mjs

      - name: Upload translation validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: translation-validation
          path: artifacts/translation-validation.json
          if-no-files-found: error

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Install Playwright
        run: npx playwright@1.62.1 install --with-deps chromium

      - name: Run published-site Browser QA
        run: npx playwright@1.62.1 test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
